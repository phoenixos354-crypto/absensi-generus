<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Absensi Generus - Offline</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #eef3ff, #dfe8ff);
      color: #14163a;
    }
    img { width: 72px; height: 72px; border-radius: 20px; }
    h1 { font-size: 20px; margin: 0; }
    p { margin: 0; font-size: 14px; color: #5b5f7a; max-width: 22rem; }
    button {
      margin-top: 8px;
      border: none;
      cursor: pointer;
      padding: 14px 28px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 14px;
      color: white;
      background: linear-gradient(140deg, #2f65f5, #1e40c9);
    }
  </style>
</head>
<body>
  <img src="/icon-192.png" alt="Absensi Generus" />
  <h1>Tidak ada koneksi internet</h1>
  <p>Absensi Generus butuh koneksi internet untuk memuat data terbaru. Cek koneksi kamu lalu coba lagi.</p>
  <button onclick="location.reload()">Coba Lagi</button>
</body>
</html>
